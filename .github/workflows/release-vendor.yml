name: Release vendor wheels

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  vendor:
    name: Build and upload vendor tarball
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Build vendor tarball
        run: packaging/vendor-wheels.sh

      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload "${{ github.event.release.tag_name }}" packaging/vendor-wheels.tar.gz
          --clobber
