name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  sanity:
    name: Sanity - ${{ matrix.python-version }}
    runs-on: ubuntu-26.04

    strategy:
      fail-fast: true
      matrix:
        python-version:
          - "3.9"  # RHEL 9.8/9.9
          - "3.10"
          - "3.11"
          - "3.12" # RHEL 10.3/10.4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          prune-cache: false
      - run: make setup

      - parallel:
          - name: Lint
            run: make lint

          - name: Format
            run: make format

          - name: Typecheck
            run: make CI_PYTHON_VERSION=${{ matrix.python-version }} type

          - name: Test
            run: make test
